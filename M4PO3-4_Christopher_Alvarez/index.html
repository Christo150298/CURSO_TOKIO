<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Práctica 3 y 4</h1>

    <div id="resultado"></div>

    <button id="nuevoRegistro">Añadir registro</button>

    <script>
        fetch("https://jsonplaceholder.typicode.com/photos?_limit=20")
            .then(response => response.json())
            .then(datos => {

                const tabla = document.createElement("table");
                //CABECERA DE LA TABLA
                const cabecera = document.createElement("tr");

                const thAlbum = document.createElement("th");
                const thTitulo = document.createElement("th");
                const thImagen = document.createElement("th");
                const thEliminar = document.createElement("th");

                thAlbum.textContent = "ID del álbum";
                thTitulo.textContent = "Título del álbum";
                thImagen.textContent = "Imagen";
                thEliminar.textContent = "Eliminar";

                cabecera.appendChild(thAlbum);
                cabecera.appendChild(thTitulo);
                cabecera.appendChild(thImagen);
                cabecera.appendChild(thEliminar);

                tabla.appendChild(cabecera);
                //DATOS DE LA TABLA
                datos.forEach(dato => {

                    const fila = document.createElement("tr");
                    
                    const celdaAlbum = document.createElement("td");
                    const celdaTitulo = document.createElement("td");
                    const celdaImagen = document.createElement("td");
                    const celdaEliminar = document.createElement("td");

                    //ID DEL ÁLBUM Y REGISTRO
                    celdaAlbum.textContent = "Álbum: " + dato.albumId + " | Registro: " + dato.id;
                    //TÍTULO
                    celdaTitulo.textContent = dato.title;
                    //IMAGEN
                    const imagen = document.createElement("img");
                    imagen.src = dato.url;
                    celdaImagen.appendChild(imagen);
                    //BOTÓN DE ELIMINAR
                    const botonEliminar = document.createElement("button");
                    botonEliminar.textContent = "Eliminar";

                    botonEliminar.addEventListener("click", () => {
                        
                        fila.remove();

                        fetch("https://jsonplaceholder.typicode.com/photos/" + dato.id, {
                            method: "DELETE"
                        })

                        .then(response => response.json())
                        .then(resultado => console.log(resultado));

                    });

                    celdaEliminar.appendChild(botonEliminar);

                    fila.appendChild(celdaAlbum)
                    fila.appendChild(celdaTitulo)
                    fila.appendChild(celdaImagen)
                    fila.appendChild(celdaEliminar)

                    tabla.appendChild(fila);
                })

                document.getElementById("resultado").appendChild(tabla);

            });
            //AÑADIR NUEVO REGISTRO
            document.getElementById("nuevoRegistro").addEventListener("click", () => {

            const nuevoDato = {
                albumId: 1,
                thumbnailUrl: null,
                title: "Christopher Alvarez",
                url: "https://cursos.com/wp-content/uploads/2021/04/academia-tokio-school.jpg"
            };

            fetch("https://jsonplaceholder.typicode.com/photos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(nuevoDato)
            })
            .then(response => response.json())
            .then(resultado => console.log(resultado));

        });

    </script>

</body>
</html>
